name: Screenshots

# The screenshot tour: photographs every app screen on the 6.9-inch iPhone so
# each one can be checked against the same page on pitch-atlas.com, and so the
# App Store set comes from the real build. Runs when a branch named
# shots/<set>/<anything> is pushed. <set> is "all" or stop names joined by
# commas (atlas,index,specimen; see ScreenshotTourUITests.tour). Add "-full"
# to the set ("all-full") to keep full-size PNGs. A second job photographs the
# same stops on pitch-atlas.com (scripts/capture-web.mjs). Not part of the CI
# gate.
on:
  push:
    branches: ["shots/**"]

jobs:
  tour:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot the 6.9-inch iPhone at 9:41
        run: |
          uuid='[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          UDID="$(xcrun simctl list devices available | grep -E 'iPhone 17 Pro Max \(' | head -1 | grep -oE "$uuid" || true)"
          if [ -z "$UDID" ]; then
            UDID="$(xcrun simctl list devices available | grep -E 'Pro Max \(' | tail -1 | grep -oE "$uuid" || true)"
          fi
          if [ -z "$UDID" ]; then xcrun simctl list devices available; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 \
            || echo "status bar override unavailable; shots keep the live clock"
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run the tour
        run: |
          SET="${GITHUB_REF_NAME#shots/}"; SET="${SET%%/*}"
          STOPS="${SET%-full}"
          echo "Tour stops: $STOPS"
          mkdir -p diag
          ( TEST_RUNNER_PA_SHOTS="$STOPS" xcodebuild test \
              -scheme PitchAtlasScreenshots \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath .build/DerivedData \
              -resultBundlePath shots.xcresult > xcodebuild.log 2>&1; echo "XCB_EXIT=$?" >> xcodebuild.log ) &
          # Sample the app's threads where the grip library stalls the tour.
          stage=0
          for i in $(seq 1 3000); do
            grep -q "XCB_EXIT=" xcodebuild.log && break
            if [ $stage -eq 0 ] && grep -q "TOUR grips page 20" xcodebuild.log; then
              PID="$(pgrep -x PitchAtlas | head -1)"; echo "app pid: $PID"
              sudo spindump "$PID" 8 10 -file diag/spin-0-page20.txt >/dev/null 2>&1 || echo "spindump failed"
              stage=1
            fi
            if [ $stage -eq 1 ] && grep -q "TOUR grips page 29" xcodebuild.log; then
              PID="$(pgrep -x PitchAtlas | head -1)"
              sleep 5
              top -l 1 -n 12 -o cpu > diag/top-b.txt 2>&1 || true
              sudo spindump "$PID" 15 10 -file diag/spin-b-page29.txt >/dev/null 2>&1 || echo "spindump failed"
              sleep 45
              top -l 1 -n 12 -o cpu > diag/top-c.txt 2>&1 || true
              sudo spindump "$PID" 15 10 -file diag/spin-c-later.txt >/dev/null 2>&1 || echo "spindump failed"
              stage=2
            fi
            sleep 1
          done
          wait
          cp xcodebuild.log diag/ || true
          grep -E "error:|failed|Test Case|TOUR |\*\* TEST|XCB_EXIT" xcodebuild.log | tail -400

      - name: Export the screenshots
        if: always()
        run: |
          SET="${GITHUB_REF_NAME#shots/}"; SET="${SET%%/*}"
          FLAG=""; case "$SET" in *-full) FLAG="--full";; esac
          xcrun xcresulttool export attachments --path shots.xcresult --output-path raw
          python3 scripts/export-shots.py raw shots $FLAG
          ls shots | head -200

      - name: Upload the diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          retention-days: 7

  # The same stops on pitch-atlas.com at 440pt, the width of the 6.9-inch iPhone.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install a headless Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Photograph the site
        run: |
          SET="${GITHUB_REF_NAME#shots/}"; SET="${SET%%/*}"
          PA_SHOTS="${SET%-full}" node scripts/capture-web.mjs web

      - name: Upload the site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web
          retention-days: 7
